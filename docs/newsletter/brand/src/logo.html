<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logo 1024×1024</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="_base.css" />
    <style>
      /* Full-bleed square: Beehiiv crops logos to a circle in places, so the
     initial and dot stay inside the central circle. */
      .tile {
        width: 1024px;
        height: 1024px;
        font-size: 600px;
        letter-spacing: -0.02em;
      }
      .tile span {
        transform: translateY(2%);
      }
      .tile .dot {
        width: 104px;
        height: 104px;
        top: 236px;
        right: 236px;
      }
    </style>
  </head>
  <body>
    <div class="tile"><span>A</span><i class="dot"></i></div>
  </body>
</html>
