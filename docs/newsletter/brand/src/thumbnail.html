<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thumbnail 1200×630</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="_base.css" />
    <style>
      /* Social and web preview image (Open Graph size). Content stays clear of
     the edges, which some networks crop. */
      body {
        width: 1200px;
        height: 630px;
        background: var(--gradient-page);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }
      .tile {
        width: 132px;
        height: 132px;
        border-radius: 30px;
        font-size: 78px;
      }
      .tile .dot {
        width: 15px;
        height: 15px;
        top: 29px;
        right: 29px;
      }
      h1 {
        margin-top: 44px;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.04;
      }
      p {
        margin-top: 24px;
        font-size: 34px;
        font-weight: 500;
        color: var(--muted-foreground);
        line-height: 1.3;
        max-width: 900px;
      }
      .cta {
        margin-top: 36px;
        font-size: 26px;
        font-weight: 800;
        color: var(--foreground);
        padding: 14px 26px;
        border: 2px solid var(--border);
        border-radius: 999px;
        align-self: flex-start;
        background: oklch(0.95 0.01 280 / 5%);
      }
    </style>
  </head>
  <body>
    <div class="tile"><span>A</span><i class="dot"></i></div>
    <h1>AI Remote Work <span class="gradient-text">Today</span></h1>
    <p>
      The daily intelligence briefing on the emerging market for human work in
      AI.
    </p>
    <span class="cta">Free daily briefing · airemoteworktoday.com</span>
  </body>
</html>
