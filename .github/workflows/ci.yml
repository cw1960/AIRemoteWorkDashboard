name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm functions:check

      # The feed reads jobs at request time: build and test against a local
      # Supabase stack seeded with supabase/seed.sql (sample jobs only).
      - name: Start local Supabase (API and seeded database)
        run: >
          pnpm exec supabase start
          -x studio,imgproxy,logflare,vector,supavisor,mailpit,realtime,storage-api,postgres-meta,edge-runtime
      - name: Point the app at local Supabase
        run: >
          pnpm exec supabase status -o env
          | grep -E '^(API_URL|ANON_KEY)='
          | sed -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/'
          -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/'
          | tr -d '"' >> "$GITHUB_ENV"

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts only Postgres, applies supabase/migrations, then runs pgTAP.
      - run: pnpm exec supabase db start
      - run: pnpm db:test
